name: Build SwagaBrowser APK

on:
  workflow_dispatch:
  push:
    paths:
      - "swaga-src.zip"
      - ".github/workflows/build-apk.yml"
      - "patches/optimize-low-end-ui.py"
      - "patches/compact-menu-protection.py"
      - "patches/protection-dashboard.py"
      - "patches/download-manager.py"
      - "patches/download-notification.py"
      - "patches/swaga-vpn-foundation.py"
      - "patches/wireguard-vpn.py"
      - "patches/vpn-src/**"
      - "patches/swaga-premium-payload-*.txt"
      - "patches/swaga-premium-ux.py"
      - "patches/oled-dark-theme.py"
      - "patches/refine-accent-themes.py"
      - "patches/browser-companion.py.gz.b64"
      - "patches/companion-compile-fixes.py"
      - "patches/companion-method-name-fixes.py"
      - "patches/swaga-011-beta-*.txt"
      - "patches/swaga-011-setter-fix.py"
      - "patches/swaga-012-enhancement-*.txt"
      - "patches/swaga-012-compile-fixes.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # swaga-src.zip now holds the COMPLETE project (real Kotlin sources, resources, Gradle files).
      # Nothing is patched or generated on the fly any more: what is in the zip is what gets compiled.
      - name: Unpack project
        run: |
          set -euo pipefail
          rm -rf android-project && mkdir android-project
          unzip -q swaga-src.zip -d android-project
          test -f android-project/app/src/main/java/app/swaga/browser/themes/LiquidGlass.kt
          test -f android-project/app/src/main/res/raw/swaga_hero.mp4

      - name: Apply minimal dark redesign
        run: python3 patches/apply-minimal-dark.py android-project

      - name: Optimize Compose UI for low-memory devices
        run: python3 patches/optimize-low-end-ui.py android-project

      - name: Compact browser menu and configure protection UI
        run: python3 patches/compact-menu-protection.py android-project

      - name: Add live GeckoView tracker dashboard
        run: python3 patches/protection-dashboard.py android-project

      - name: Apply OLED dark design system
        run: python3 patches/oled-dark-theme.py android-project

      - name: Refine OLED and light themes with adaptive accent
        run: python3 patches/refine-accent-themes.py android-project

      - name: Add native download manager and restore full mascot rendering
        run: python3 patches/download-manager.py

      - name: Add in-browser download start notification
        run: python3 patches/download-notification.py

      - name: Add browser-scoped Swaga VPN service foundation
        run: python3 patches/swaga-vpn-foundation.py android-project

      - name: Integrate real WireGuard tunnel and VPN controls
        run: python3 patches/wireguard-vpn.py android-project

      - name: Add Swaga VPN Control Center and Swaga_AI
        run: |
          set -euo pipefail
          cat patches/swaga-premium-payload-00a.txt \
              patches/swaga-premium-payload-00b.txt \
              patches/swaga-premium-payload-00c.txt \
              patches/swaga-premium-payload-01.txt \
              patches/swaga-premium-payload-02.txt \
              patches/swaga-premium-payload-03.txt \
              patches/swaga-premium-payload-04.txt \
              patches/swaga-premium-payload-05.txt \
              patches/swaga-premium-payload-06.txt \
              patches/swaga-premium-payload-07.txt \
              patches/swaga-premium-payload-08.txt \
              patches/swaga-premium-payload-09.txt \
              > patches/swaga-premium-src.tar.xz.b64
          test "$(wc -c < patches/swaga-premium-src.tar.xz.b64)" -eq 28512
          echo "fc5e60e979c3f97f254747540c74e25f303c3a039845722cfe430c787191214f  patches/swaga-premium-src.tar.xz.b64" | sha256sum --check
          base64 --decode patches/swaga-premium-src.tar.xz.b64 | tar -xJf - -C patches
          python3 patches/swaga-premium-ux.py android-project

      - name: Build SwagaBrowser 0.1.1 beta plugins, Music and AI history
        run: |
          set -euo pipefail
          base64 --decode patches/browser-companion.py.gz.b64 | gzip -dc > patches/browser-companion.py
          python3 patches/browser-companion.py android-project
          python3 patches/companion-compile-fixes.py android-project
          python3 patches/companion-method-name-fixes.py android-project

      - name: Apply SwagaBrowser 0.1.1 beta update
        run: |
          set -euo pipefail
          cat patches/swaga-011-beta-00a.txt patches/swaga-011-beta-00b.txt patches/swaga-011-beta-01.txt patches/swaga-011-beta-02a.txt patches/swaga-011-beta-02b.txt > /tmp/swaga-011-beta.patch.xz.b64
          test "$(wc -c < /tmp/swaga-011-beta.patch.xz.b64)" -eq 26464
          echo "ccb2297b1a90b7ca26615b6e74368bdec2f2988b1c466c54c402924794751014  /tmp/swaga-011-beta.patch.xz.b64" | sha256sum --check
          base64 --decode /tmp/swaga-011-beta.patch.xz.b64 | xz -dc | patch -p1 -d android-project
          rm -f android-project/app/src/main/java/app/swaga/browser/ui/SwagaCompanionUi.kt

      - name: Resolve legacy preference setter clashes
        run: python3 patches/swaga-011-setter-fix.py android-project

      - name: Upgrade Swaga Pleer, AI, Text Motion and Whole-device VPN
        run: |
          set -euo pipefail
          cat patches/swaga-012-enhancement-00.txt patches/swaga-012-enhancement-01.txt patches/swaga-012-enhancement-02.txt patches/swaga-012-enhancement-03.txt patches/swaga-012-enhancement-04.txt > /tmp/swaga-012.patch.xz.b64
          test "$(wc -c < /tmp/swaga-012.patch.xz.b64)" -eq 21584
          echo "e4d45943ff012c8bda44ef5a676dca05b0a756daa48040aa95fa24a44ff44fa4  /tmp/swaga-012.patch.xz.b64" | sha256sum --check
          base64 --decode /tmp/swaga-012.patch.xz.b64 | xz -dc | patch --batch --forward -p1 -d android-project
          python3 patches/swaga-012-compile-fixes.py android-project

      # Publish the actual optimized source used by this build.
      - name: Upload source snapshot
        uses: actions/upload-artifact@v5
        with:
          name: SwagaBrowser-source-snapshot
          path: android-project/
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        working-directory: android-project
        run: gradle --no-daemon assembleRelease

      # Proves the new code really ended up in the APK (not only in the sources).
      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK="$(ls android-project/app/build/outputs/apk/release/*.apk | head -n1)"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          rm -rf /tmp/apk && mkdir /tmp/apk && unzip -oq "$APK" 'classes*.dex' -d /tmp/apk
          for sym in AppOverlaysKt AppSheet AppDialog appButton enforceSessionBudget restoreOrLoad "Swaga AI" "Swaga VPN" BrowserMediaController Md3DownloadIndicator MusicLibrarySheet SwagaMusicPlayer SwagaPlaybackService SwagaMiniPlayerKt AiChatStore PluginSettingsSheet LauncherShortcutSheet; do
            if grep -aq "$sym" /tmp/apk/classes*.dex; then echo "OK   dex contains $sym"; else echo "MISSING $sym"; exit 1; fi
          done
          if grep -aq "SwagaCompanionSheet" /tmp/apk/classes*.dex; then echo "Streak mascot code still present"; exit 1; fi
          grep -aq "0.1.1-beta" /tmp/apk/classes*.dex || true
          unzip -l "$APK" | grep -q "swaga_hero" && echo "OK   hero video packaged"
          unzip -l "$APK" | grep -q "libxul.so" && echo "OK   GeckoView engine packaged"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libxul.so" && echo "OK   arm64 GeckoView packaged"
          if unzip -l "$APK" | grep -Eq "lib/(x86|x86_64|armeabi-v7a)/"; then echo "Unexpected non-arm64 ABI payload"; exit 1; fi
          if grep -aq "LiquidGlassKt" /tmp/apk/classes*.dex; then echo "Legacy glass code still present"; exit 1; fi

      - name: Verify release signature
        run: |
          set -euo pipefail
          APK="$(ls android-project/app/build/outputs/apk/release/*.apk | head -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: SwagaBrowser-release-APK
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
