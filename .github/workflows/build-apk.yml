name: Build SwagaBrowser APK

on:
  workflow_dispatch:
  push:
    paths:
      - "swaga-src.zip"
      - "swaga-src-with-build-workflow.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          set -euo pipefail
          ARCHIVE="swaga-src.zip"
          if [ ! -f "$ARCHIVE" ]; then
            ARCHIVE="swaga-src-with-build-workflow.zip"
          fi
          test -f "$ARCHIVE"
          mkdir -p android-project
          unzip -o -q "$ARCHIVE" -d android-project
          find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -euo pipefail
          PROJECT_DIR="$(dirname "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwagaBrowser-debug-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
