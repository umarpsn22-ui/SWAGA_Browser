name: Build SwagaBrowser APK

on:
  workflow_dispatch:
  push:
    paths:
      - "swaga-src.zip"
      - "swaga-src-with-build-workflow.zip"
      - "patches/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          set -euo pipefail
          ARCHIVE="swaga-src.zip"
          if [ ! -f "$ARCHIVE" ]; then ARCHIVE="swaga-src-with-build-workflow.zip"; fi
          test -f "$ARCHIVE"
          mkdir -p android-project
          unzip -o -q "$ARCHIVE" -d android-project
          echo "Archive used: $ARCHIVE"
          test -f android-project/app/src/main/java/app/swaga/browser/BrowserViewModel.kt

      - name: Inspect browser engine integration points
        run: |
          set -euo pipefail
          echo "=== Gradle files ==="
          find android-project -maxdepth 3 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' \) -print
          echo "=== App dependencies ==="
          sed -n '1,240p' android-project/app/build.gradle.kts
          echo "=== Browser engine source files ==="
          find android-project/app/src/main/java/app/swaga/browser -type f -name '*.kt' -print
          echo "=== WebView references ==="
          grep -RInE 'WebView|WebViewClient|WebChromeClient|AndroidView|loadUrl|evaluateJavascript' android-project/app/src/main/java/app/swaga/browser || true

      - name: Apply real browser source changes
        run: |
          set -euxo pipefail
          base64 -d patches/browser-update.patch.gz.b64 | gzip -dc > /tmp/swaga-browser-update.patch
          test -s /tmp/swaga-browser-update.patch
          git apply --check --directory=android-project /tmp/swaga-browser-update.patch
          git apply --directory=android-project /tmp/swaga-browser-update.patch
          base64 -d patches/icons-hotfix.patch.gz.b64 | gzip -dc > /tmp/swaga-icons-hotfix.patch
          git apply --check --directory=android-project /tmp/swaga-icons-hotfix.patch
          git apply --directory=android-project /tmp/swaga-icons-hotfix.patch
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android-project/app/src/main/java/app/swaga/browser")
          files = [
              root / "BrowserViewModel.kt",
              root / "ui/BottomBar.kt",
              root / "ui/BrowserApp.kt",
              root / "ui/StartPage.kt",
          ]
          for path in files:
              source = path.read_text(encoding="utf-8")
              import re
              source = re.sub(r"\b(?:isGhostMode|ghostMode)\b", "ghostModeEnabled", source)
              path.write_text(source, encoding="utf-8")
          PY
          base64 -d patches/full-browser-update.patch.gz.b64 | gzip -dc > /tmp/swaga-full-browser-update.patch
          test -s /tmp/swaga-full-browser-update.patch
          git apply --check --directory=android-project /tmp/swaga-full-browser-update.patch
          git apply --directory=android-project /tmp/swaga-full-browser-update.patch
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android-project/app")
          sheets = root / "src/main/java/app/swaga/browser/ui/Sheets.kt"
          sheet_source = sheets.read_text(encoding="utf-8")
          if "import androidx.compose.material3.TextButton" not in sheet_source:
              sheet_source = sheet_source.replace(
                  "import androidx.compose.material3.Text\n",
                  "import androidx.compose.material3.Text\nimport androidx.compose.material3.TextButton\n",
                  1,
              )
          sheets.write_text(sheet_source, encoding="utf-8")
          gradle = root / "build.gradle.kts"
          source = gradle.read_text(encoding="utf-8")
          source = source.replace('versionName = "0.1.0"', 'versionName = "0.2.0"')
          if 'versionName = "0.2.0"' not in source:
              raise SystemExit("Cannot set app version")
          gradle.write_text(source, encoding="utf-8")
          (root / "src/main/res/values/strings.xml").write_text("""<resources>
              <string name="app_name">#SWAGA_Browser</string>
          </resources>
          """, encoding="utf-8")
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = root / "src/main/res/mipmap-anydpi-v26" / name
              source = path.read_text(encoding="utf-8")
              source = source.replace("@drawable/ic_launcher_foreground", "@drawable/swaga_logo_inset")
              source = source.replace('@drawable/swaga_logo"', '@drawable/swaga_logo_inset"')
              if "@drawable/swaga_logo_inset" not in source:
                  raise SystemExit(f"Cannot resize launcher foreground in {name}")
              path.write_text(source, encoding="utf-8")
          inset = root / "src/main/res/drawable/swaga_logo_inset.xml"
          inset_source = inset.read_text(encoding="utf-8").replace("@drawable/swaga_logo", "@drawable/ic_launcher_foreground")
          inset.write_text(inset_source, encoding="utf-8")

          start_page = root / "src/main/java/app/swaga/browser/ui/StartPage.kt"
          page = start_page.read_text(encoding="utf-8")
          page = page.replace('ТВОЁ ОКНО В ИНТЕРНЕТ', 'ТВОЕ ОКНО В СВАГУ🤤🤤🤤')
          page = page.replace('ТВОЙ БРАУЗЕР. ТВОИ ПРАВИЛА.', 'Свагаааа🤤🤤🤤')

          hero_start = page.index('@Composable\nprivate fun SwagaHero(')
          hero_end = page.index('\n@Composable\nprivate fun SectionTitle', hero_start)
          hero = '''@Composable
          private fun SwagaHero(tiltX: Float, tiltY: Float) {
              val c = LocalSwaga.current
              val depth = Modifier.graphicsLayer {
                  rotationX = tiltX
                  rotationY = tiltY
                  cameraDistance = 18f * density
                  scaleX = 1f + kotlin.math.abs(tiltY) * 0.0015f
                  scaleY = 1f + kotlin.math.abs(tiltX) * 0.0015f
              }
              val extrusion = listOf(
                  Color(0xFF101827),
                  Color(0xFF18243A),
                  Color(0xFF24334D),
                  Color(0xFF34445E),
                  Color(0xFF64748B),
              )
              Box(
                  Modifier.fillMaxWidth().height(136.dp),
                  contentAlignment = Alignment.Center,
              ) {
                  Box(
                      Modifier
                          .size(width = 290.dp, height = 112.dp)
                          .then(depth)
                          .background(
                              Brush.radialGradient(
                                  listOf(c.accent.copy(alpha = 0.23f), Color.White.copy(alpha = 0.055f), Color.Transparent),
                              ),
                              CircleShape,
                          ),
                  )
                  extrusion.forEachIndexed { index, shade ->
                      Text(
                          "#SWAGAA",
                          modifier = Modifier.offset(y = ((extrusion.lastIndex - index + 1) * 2).dp).then(depth),
                          color = shade,
                          fontSize = 60.sp,
                          fontWeight = FontWeight.Black,
                          letterSpacing = (-3.6).sp,
                      )
                  }
                  Text(
                      "#SWAGAA",
                      modifier = depth,
                      color = Color.White,
                      fontSize = 60.sp,
                      fontWeight = FontWeight.Black,
                      letterSpacing = (-3.6).sp,
                      style = TextStyle(
                          shadow = Shadow(Color.White.copy(alpha = 0.38f), Offset(0f, 0f), 25f),
                      ),
                  )
                  Box(
                      Modifier
                          .align(Alignment.TopCenter)
                          .padding(top = 18.dp)
                          .width(164.dp)
                          .height(1.dp)
                          .background(
                              Brush.horizontalGradient(
                                  listOf(Color.Transparent, Color.White.copy(alpha = 0.55f), c.accent.copy(alpha = 0.42f), Color.Transparent),
                              ),
                          ),
                  )
              }
          }
          '''

          page = page[:hero_start] + hero + page[hero_end:]

          actions = '''
            Spacer(Modifier.height(16.dp))
            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(9.dp)) {
                StartAction("＋ Новая вкладка", Modifier.weight(1f)) { vm.newTab() }
                if (vm.closedTabs.isNotEmpty() && !vm.ghostModeEnabled) {
                    StartAction("↶ Вернуть вкладку", Modifier.weight(1f)) { vm.restoreClosedTab() }
                }
            }
          '''
          if "StartAction(" not in page:
              action_position = page.index("            if (vm.ghostModeEnabled) {")
              page = page[:action_position] + actions + page[action_position:]

          section_anchor = '@Composable\nprivate fun SectionTitle(text: String) {'
          action_component = '''@Composable
          private fun StartAction(label: String, modifier: Modifier = Modifier, onClick: () -> Unit) {
              val c = LocalSwaga.current
              Box(
                  modifier
                      .height(42.dp)
                      .panel(RoundedCornerShape(15.dp))
                      .clickable(onClick = onClick)
                      .padding(horizontal = 10.dp),
                  contentAlignment = Alignment.Center,
              ) {
                  Text(
                      label,
                      color = c.text,
                      fontSize = 11.sp,
                      fontWeight = FontWeight.SemiBold,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                  )
              }
          }

          '''
          if "private fun StartAction(" not in page:
              page = page.replace(section_anchor, action_component + section_anchor, 1)
          if 'ТВОЕ ОКНО В СВАГУ🤤🤤🤤' not in page or 'Свагаааа🤤🤤🤤' not in page:
              raise SystemExit("Requested home page captions were not applied")
          start_page.write_text(page, encoding="utf-8")

          view_model = root / "src/main/java/app/swaga/browser/BrowserViewModel.kt"
          vm_source = view_model.read_text(encoding="utf-8")
          old_sound = "GhostSoundPlayer.play(getApplication(), enabled)"
          new_sound = '''if (enabled) {
                      GhostVoicePlayer.speak(getApplication(), "Ahhh, fresh meat")
                  } else {
                      GhostSoundPlayer.play(getApplication(), false)
                  }'''
          if old_sound in vm_source:
              vm_source = vm_source.replace(old_sound, new_sound, 1)
          elif "GhostVoicePlayer.speak" not in vm_source:
              raise SystemExit("Could not locate Ghost Mode sound call")
          view_model.write_text(vm_source, encoding="utf-8")

          voice_file = root / "src/main/java/app/swaga/browser/GhostVoicePlayer.kt"
          voice_file.write_text('''package app.swaga.browser

          import android.content.Context
          import android.speech.tts.TextToSpeech
          import java.util.Locale

          /**
           * Speaks an original system-TTS version of the short Ghost Mode cue.
           * Keeps only the application context and queues speech while TTS initializes.
           */
          object GhostVoicePlayer {
              private var engine: TextToSpeech? = null
              private var initialized = false
              private var pendingText: String? = null

              @Synchronized
              fun speak(context: Context, text: String) {
                  val current = engine
                  if (current == null) {
                      pendingText = text
                      engine = TextToSpeech(context.applicationContext) { status ->
                          synchronized(this) {
                              val tts = engine ?: return@synchronized
                              if (status == TextToSpeech.SUCCESS) {
                                  val language = tts.setLanguage(Locale.US)
                                  initialized = language >= TextToSpeech.LANG_AVAILABLE
                                  if (initialized) {
                                      tts.setSpeechRate(0.92f)
                                      tts.setPitch(0.90f)
                                      pendingText?.let { phrase ->
                                          pendingText = null
                                          tts.speak(phrase, TextToSpeech.QUEUE_FLUSH, null, "swaga-ghost-entry")
                                      }
                                  } else {
                                      pendingText = null
                                  }
                              } else {
                                  pendingText = null
                              }
                          }
                      }
                  } else if (initialized) {
                      current.speak(text, TextToSpeech.QUEUE_FLUSH, null, "swaga-ghost-entry")
                  } else {
                      pendingText = text
                  }
              }
          }
          ''', encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android-project/app")
          theme = root / "src/main/java/app/swaga/browser/themes/SwagaTheme.kt"
          source = theme.read_text(encoding="utf-8")
          panel_at = source.index("fun Modifier.panel(")
          start = source.rfind("@Composable", 0, panel_at)
          replacement = """@Composable
          fun Modifier.panel(
              shape: Shape = RoundedCornerShape(16.dp),
              elevated: Boolean = false,
          ): Modifier {
              val c = LocalSwaga.current
              val base = if (elevated) c.surfaceHigh else c.surface
              val depth = if (elevated) 24.dp else 13.dp
              return if (c.glass) {
                  this
                      .shadow(depth, shape, clip = false)
                      .background(
                          Brush.linearGradient(
                              colors = listOf(
                                  Color.White.copy(alpha = if (c.isDark) 0.19f else 0.76f),
                                  base.copy(alpha = if (elevated) 0.74f else 0.66f),
                                  lerp(base, c.accent, 0.12f).copy(alpha = 0.78f),
                                  c.bg.copy(alpha = 0.72f),
                              ),
                          ),
                          shape,
                      )
                      .background(
                          Brush.radialGradient(
                              colors = listOf(c.accent.copy(alpha = 0.13f), Color.Transparent),
                              radius = 520f,
                          ),
                          shape,
                      )
                      .border(
                          1.dp,
                          Brush.linearGradient(
                              listOf(
                                  Color.White.copy(alpha = 0.76f),
                                  Color.White.copy(alpha = if (c.isDark) 0.13f else 0.56f),
                                  c.accent.copy(alpha = 0.32f),
                                  Color.White.copy(alpha = 0.22f),
                              ),
                          ),
                          shape,
                      )
              } else {
                  this
                      .shadow(if (elevated) 12.dp else 6.dp, shape, clip = false)
                      .background(
                          Brush.linearGradient(
                              listOf(base, lerp(base, c.surfaceHigh, 0.52f), lerp(base, c.accent, 0.045f)),
                          ),
                          shape,
                      )
                      .border(1.dp, c.outline.copy(alpha = 0.82f), shape)
              }
          }
          """
          source = source[:start] + replacement
          theme.write_text(source, encoding="utf-8")

          page = root / "src/main/java/app/swaga/browser/ui/StartPage.kt"
          source = page.read_text(encoding="utf-8")
          source = source.replace(
              'Spacer(Modifier.height(16.dp))\\n  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(9.dp)) {',
              '''Spacer(Modifier.height(18.dp))
            Row(
                Modifier.fillMaxWidth().panel(RoundedCornerShape(18.dp), elevated = true).padding(horizontal = 14.dp, vertical = 12.dp),
                verticalAlignment = Alignment.CenterVertically,
            ) {
                Box(
                    Modifier.size(9.dp).clip(CircleShape).background(c.accent),
                )
                Spacer(Modifier.width(10.dp))
                Column(Modifier.weight(1f)) {
                    Text("СВАГА НА ПОЛНОЙ СКОРОСТИ", color = c.text, fontSize = 10.sp, fontWeight = FontWeight.Black, letterSpacing = 0.8.sp)
                    Text("Быстрый доступ, приватность и твой интернет.", color = c.dim, fontSize = 10.sp)
                }
                Text("✦", color = c.accent, fontSize = 19.sp, fontWeight = FontWeight.Black)
            }
            Spacer(Modifier.height(12.dp))
            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(9.dp)) {''',
              1,
          )
          source = source.replace(
              'Spacer(Modifier.height(42.dp))\\n            SectionTitle("БЫСТРЫЙ ДОСТУП")',
              'Spacer(Modifier.height(34.dp))\\n            SectionTitle("ТВОИ САЙТЫ")',
              1,
          )
          page.write_text(source, encoding="utf-8")

          gradle = root / "build.gradle.kts"
          g = gradle.read_text(encoding="utf-8")
          g = g.replace('versionName = "0.2.0"', 'versionName = "0.3.0"')
          if 'versionName = "0.3.0"' not in g:
              raise SystemExit("Could not bump version to 0.3.0")
          gradle.write_text(g, encoding="utf-8")
          PY
          base64 -d patches/app-changes.patch.gz.b64 | gzip -dc > /tmp/swaga-refresh.patch
          test -s /tmp/swaga-refresh.patch
          git apply --check --directory=android-project /tmp/swaga-refresh.patch
          git apply --directory=android-project /tmp/swaga-refresh.patch
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android-project/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source = source.replace('versionName = "0.3.0"', 'versionName = "0.4.0"')
          if 'versionName = "0.4.0"' not in source:
              raise SystemExit("Could not set app version to 0.4.0")
          gradle.write_text(source, encoding="utf-8")
          PY
          base64 -d patches/refresh-browser.py.gz.b64 | gzip -dc > /tmp/swaga-refresh-browser.py
          python3 /tmp/swaga-refresh-browser.py android-project/app/src/main/java/app/swaga/browser
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android-project/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source = source.replace('versionName = "0.4.0"', 'versionName = "0.5.0"')
          if 'versionName = "0.5.0"' not in source:
              raise SystemExit("Could not set app version to 0.5.0")
          gradle.write_text(source, encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          app = Path("android-project/app")
          raw = app / "src/main/res/raw"
          raw.mkdir(parents=True, exist_ok=True)
          encoded = Path("patches/swaga_hero.mp4.b64").read_text(encoding="ascii").strip()
          video = base64.b64decode(encoded, validate=True)
          if len(video) < 1000:
              raise SystemExit("Hero video asset is incomplete")
          (raw / "swaga_hero.mp4").write_bytes(video)

          page_path = app / "src/main/java/app/swaga/browser/ui/StartPage.kt"
          source = page_path.read_text(encoding="utf-8")

          imports = [
              "import android.net.Uri",
              "import android.widget.VideoView",
              "import androidx.compose.runtime.DisposableEffect",
              "import androidx.compose.ui.platform.LocalContext",
              "import androidx.compose.ui.viewinterop.AndroidView",
              "import androidx.compose.ui.draw.shadow",
              "import app.swaga.browser.R",
          ]
          for item in imports:
              if item not in source:
                  anchor = "import androidx.compose"
                  position = source.index(anchor)
                  source = source[:position] + item + "\n" + source[position:]

          source = re.sub(
              r"    var targetTiltX: Float by mutableFloatStateOf\(0f\).*?    val heroPressed by animateFloatAsState\(.*?\n",
              "",
              source,
              count=1,
              flags=re.S,
          )

          pointer_start = source.index("    Box(\n        Modifier.fillMaxSize().pointerInput(Unit) {")
          pointer_end = source.index("\n    ) {", pointer_start) + len("\n    ) {")
          source = source[:pointer_start] + "    Box(Modifier.fillMaxSize()) {" + source[pointer_end:]

          glow_start = source.index("\n        Box(\n            Modifier\n                .offset(x = 168.dp, y = 26.dp)")
          glow_end = source.index("\n\n        Column(", glow_start)
          source = source[:glow_start] + source[glow_end:]

          header_start = source.index(
              "            Row(\n"
              "                Modifier\n"
              "                    .fillMaxWidth()\n"
              "                    .padding(top = 13.dp, bottom = 2.dp),"
          )
          header_end = source.index("\n\n            Spacer(Modifier.height(24.dp))", header_start)
          header = """            Row(
              Modifier.fillMaxWidth().padding(top = 16.dp, bottom = 4.dp),
              verticalAlignment = Alignment.CenterVertically,
            ) {
              Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(2.dp)) {
                Text(
                  "#SWAGA_Browser",
                  color = c.text,
                  fontSize = 19.sp,
                  fontWeight = FontWeight.Black,
                  letterSpacing = (-0.65).sp,
                )
                Text(
                  "Высокий шанс на свагу,#SWAGA_Browser",
                  color = c.dim,
                  fontSize = 10.sp,
                  fontWeight = FontWeight.Medium,
                  maxLines = 1,
                  overflow = TextOverflow.Ellipsis,
                )
              }
              Box(
                Modifier.size(40.dp).panel(CircleShape).clickable(onClick = onSettings),
                contentAlignment = Alignment.Center,
              ) {
                Icon(Icons.Filled.Settings, contentDescription = "Настройки", tint = c.text, modifier = Modifier.size(19.dp))
              }
            }"""
          source = source[:header_start] + header + source[header_end:]

          hero_start = source.index(
              "            Spacer(Modifier.height(24.dp))\n"
              "            SwagaHero(gazeX, gazeY, heroPressed)"
          )
          hero_end = source.index(
              "\n\n            Row(\n"
              "                Modifier\n"
              "                    .fillMaxWidth()\n"
              "                    .height(61.dp)",
              hero_start,
          )
          source = source[:hero_start] + """            Spacer(Modifier.height(18.dp))
            SwagaHero()
            Spacer(Modifier.height(14.dp))""" + source[hero_end:]

          engine_start = source.index("            Spacer(Modifier.height(9.dp))\n            Row(", source.index("BasicTextField("))
          engine_end = source.index("\n            Spacer(Modifier.height(19.dp))", engine_start)
          source = source[:engine_start] + source[engine_end:]

          actions_start = source.index(
              "            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {"
          )
          actions_end = source.index("\n\n            if (vm.ghostModeEnabled)", actions_start)
          source = source[:actions_start] + source[actions_end:]

          links_header_start = source.index(
              "            Spacer(Modifier.height(35.dp))\n"
              "            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {"
          )
          links_header_end = source.index("\n            quickLinks.chunked(4)", links_header_start)
          source = source[:links_header_start] + """            Spacer(Modifier.height(22.dp))""" + source[links_header_end:]

          recent_start = source.index("            if (vm.recent.isNotEmpty()")
          recent_end = source.index("            Spacer(Modifier.height(34.dp))", recent_start)
          source = source[:recent_start] + source[recent_end:]

          hero_func_start = source.index("@Composable\nprivate fun SwagaHero(")
          hero_func_end = source.index("\n@Composable\nprivate fun StartAction", hero_func_start)
          hero_func = """@Composable
          private fun SwagaHero() {
              val c = LocalSwaga.current
              Row(
                  Modifier.fillMaxWidth().height(106.dp),
                  horizontalArrangement = Arrangement.Center,
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Box(Modifier.weight(1f), contentAlignment = Alignment.Center) {
                      Text(
                          "#SWAGAA",
                          color = Color(0xFFF7F9FF),
                          fontSize = 46.sp,
                          fontWeight = FontWeight.Black,
                          letterSpacing = (-3.6).sp,
                          maxLines = 1,
                          softWrap = false,
                          style = TextStyle(
                              shadow = Shadow(c.text.copy(alpha = 0.20f), Offset(0f, 2f), 10f),
                          ),
                      )
                  }
                  Spacer(Modifier.width(8.dp))
                  SwagaHeroVideo()
              }
          }

          @Composable
          private fun SwagaHeroVideo() {
              val context = LocalContext.current
              val videoView = remember(context) {
                  VideoView(context).apply {
                      setVideoURI(Uri.parse("android.resource://" + context.packageName + "/" + R.raw.swaga_hero))
                      setOnPreparedListener { player ->
                          player.isLooping = true
                          player.setVolume(0f, 0f)
                          start()
                      }
                  }
              }
              DisposableEffect(videoView) {
                  onDispose { videoView.stopPlayback() }
              }
              Box(
                  Modifier
                      .size(56.dp)
                      .shadow(10.dp, RoundedCornerShape(15.dp))
                      .clip(RoundedCornerShape(15.dp))
                      .background(LocalSwaga.current.surface.copy(alpha = 0.76f)),
              ) {
                  AndroidView(
                      factory = { videoView },
                      modifier = Modifier.fillMaxSize(),
                      update = { /* VideoView starts from OnPreparedListener only. */ },
                  )
              }
          }
          """
          source = source[:hero_func_start] + hero_func + source[hero_func_end:]

          tile_start = source.index("@Composable\nprivate fun Tile(")
          tile_end = source.index("\n@Composable\nprivate fun Letter", tile_start)
          tile_func = """@Composable
          private fun Tile(title: String, modifier: Modifier, onClick: () -> Unit) {
              val c = LocalSwaga.current
              Column(
                  modifier
                      .height(78.dp)
                      .clip(RoundedCornerShape(14.dp))
                      .clickable(onClick = onClick)
                      .padding(vertical = 6.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center,
              ) {
                  Letter(title, 39.dp)
                  Spacer(Modifier.height(5.dp))
                  Text(
                      title,
                      color = c.text,
                      fontSize = 9.sp,
                      fontWeight = FontWeight.Medium,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                      textAlign = TextAlign.Center,
                  )
              }
          }
          """
          source = source[:tile_start] + tile_func + source[tile_end:]

          source = source.replace(".clip(CircleShape)\n            .background(", ".clip(RoundedCornerShape(13.dp))\n            .background(", 1)
          source = source.replace('Text("ТВОЁ ОКНО В СВАГУ"', 'Text("ТВОЁ ОКНО В СВАГУ"') if False else source
          page_path.write_text(source, encoding="utf-8")

          gradle = app / "build.gradle.kts"
          g = gradle.read_text(encoding="utf-8")
          import re
          g, changed = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.0"', g, count=1)
          if changed != 1 or 'versionName = "1.0.0"' not in g:
              raise SystemExit("Could not set app version to 1.0.0")
          gradle.write_text(g, encoding="utf-8")

          if "#SWAGA_Browser" not in source or "Высокий шанс на свагу,#SWAGA_Browser" not in source:
              raise SystemExit("Required brand header text is missing")
          if "SwagaHeroVideo" not in source or "R.raw.swaga_hero" not in source:
              raise SystemExit("Looping hero video is not wired into the home screen")
          print("Applied minimal home screen, compact brand header, and looping hero video.")
          PY
          base64 -d patches/startpage-original-layout.gz.b64 | gzip -dc > android-project/app/src/main/java/app/swaga/browser/ui/StartPage.kt
          base64 -d patches/glass-material.py.b64 > /tmp/swaga-glass-material.py
          python3 /tmp/swaga-glass-material.py android-project/app/src/main/java/app/swaga/browser/themes/SwagaTheme.kt
          APP_ROOT="android-project/app/src/main/java/app/swaga/browser"
          grep -q "var ghostModeEnabled" "$APP_ROOT/BrowserViewModel.kt"
          ! grep -q "var isGhostMode" "$APP_ROOT/BrowserViewModel.kt"
          ! grep -q "var ghostMode " "$APP_ROOT/BrowserViewModel.kt"
          ! grep -R -q "ghostModeEnabledEnabled" "$APP_ROOT"
          grep -q "fun setGhostMode" "$APP_ROOT/BrowserViewModel.kt"
          ! grep -R -q "GhostModeAudioPlayer\|GhostVoicePlayer\|GhostSoundPlayer\|pursuer-stalk-ability\|ahh-fresh-meat" "$APP_ROOT"
          grep -q "trackingProtectionEnabled" "$APP_ROOT/engine/SwagaWebView.kt"
          grep -q "prepareReader" "$APP_ROOT/BrowserViewModel.kt"
          grep -q "HistoryStore" "$APP_ROOT/BrowserViewModel.kt"
          grep -q "HistorySheet" "$APP_ROOT/ui/Sheets.kt"
          grep -q "ReaderSheet" "$APP_ROOT/ui/Sheets.kt"
          grep -q "Высокий шанс на свагу,#SWAGA_Browser" "$APP_ROOT/ui/StartPage.kt"
          grep -q "SwagaHeroVideo" "$APP_ROOT/ui/StartPage.kt"
          test -s android-project/app/src/main/res/raw/swaga_hero.mp4
          grep -q "GhostModeButton" "$APP_ROOT/ui/BottomBar.kt"
          grep -q "Icons.Filled.Lock" "$APP_ROOT/ui/BottomBar.kt"
          ! grep -q "VisibilityOff" "$APP_ROOT/ui/BottomBar.kt"
          grep -q "#SWAGAA" "$APP_ROOT/ui/StartPage.kt"
          grep -q "BookmarksSheet" "$APP_ROOT/ui/Sheets.kt"
          grep -q "findAllAsync" "$APP_ROOT/ui/BottomBar.kt"
          grep -q "ACTION_VIEW_DOWNLOADS" "$APP_ROOT/ui/BottomBar.kt"
          grep -q "requestPinShortcut" "$APP_ROOT/ui/BottomBar.kt"
          grep -q "desktopUserAgent" "$APP_ROOT/engine/SwagaWebView.kt"
          grep -q "swaga_logo_inset" android-project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q "ic_launcher_foreground" android-project/app/src/main/res/drawable/swaga_logo_inset.xml
          grep -q "#FFFFFF" android-project/app/src/main/res/drawable/ic_launcher_foreground.xml
          echo "Verified existing browser UI, local history, reader mode, tracker settings, text zoom, downloads and home-screen shortcuts."

      - name: Migrate browser engine to GeckoView
        run: |
          set -euo pipefail
          python3 patches/geckoview/apply-geckoview.py
          APP_ROOT="android-project/app/src/main/java/app/swaga/browser"
          grep -q "org.mozilla.geckoview" "$APP_ROOT/engine/SwagaWebView.kt"
          grep -q "usePrivateMode" "$APP_ROOT/engine/SwagaWebView.kt"
          grep -q "SwagaGeckoTab.create" "$APP_ROOT/engine/WebViewHost.kt"
          grep -q "SwagaGeckoTab" "$APP_ROOT/tabs/Tab.kt"
          echo "Remaining WebView references (diagnostic):"
          grep -RnE "android.webkit.WebView|WebViewClient|WebChromeClient" "$APP_ROOT" || true
          echo "GeckoView adapter is active; legacy WebView matches above are diagnostic only."
          grep -q "org.mozilla.geckoview:geckoview:159.0.20261102144711" android-project/app/build.gradle.kts
          echo "GeckoView migration checks passed."

      - name: Upload transformed source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SwagaBrowser-source-snapshot
          path: |
            android-project/
          if-no-files-found: error
          retention-days: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          set -euo pipefail
          PROJECT_DIR="$(dirname "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwagaBrowser-debug-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
