name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "swaga-src.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and unpack Android project
        run: |
          test -f swaga-src.zip || { echo "Не найден файл swaga-src.zip в корне репозитория"; exit 1; }
          mkdir -p android-project
          unzip -o -q swaga-src.zip -d android-project
          echo "Файлы после распаковки:"
          find android-project -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Не найден settings.gradle или settings.gradle.kts. Возможно, архив имеет неожиданную структуру."
            exit 1
          fi

          echo "Папка Android-проекта: $PROJECT_DIR"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            cd "$PROJECT_DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "В архиве нет gradlew; запускаю установленный Gradle."
            gradle -p "$PROJECT_DIR" assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SWAGA-debug-apk
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
